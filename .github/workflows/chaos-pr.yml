name: chaos-pr

on:
  pull_request:

permissions:
  pull-requests: write
  contents: read

jobs:
  chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run chaos gate against baseline
        id: chaos
        run: >
          chaos run examples/support_agent.py:HARDENED
          --baseline .github/chaos-baseline.json
          --json chaos-report.json
        continue-on-error: true
      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('chaos-report.json', 'utf8'));
            const gate = report.gate_passed ? 'passed' : 'FAILED';
            const body = `**agent-chaos**: score ${report.score}/100 (gate ${gate}, unsafe: ${report.unsafe})`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-pr-report
          path: chaos-report.json
      - name: Fail the job if the chaos gate failed
        if: steps.chaos.outcome == 'failure'
        run: exit 1
