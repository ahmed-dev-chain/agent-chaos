name: ci
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests examples
      - name: Tests
        run: pytest
      - name: Chaos gate (hardened example must pass)
        run: chaos run examples/support_agent.py:HARDENED --min-score 95 --html chaos-report --json chaos-report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-report-${{ matrix.python-version }}
          path: |
            chaos-report
            chaos-report.json
